<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HRK Jewellery — Fine Jewellery, Crafted for Everyday Magic</title>
    <meta name="description" content="Shop tarnish-free, 18K gold-plated fine jewellery — rings, necklaces, earrings, bracelets and anklets." />

    <!-- Preview card when the site is shared on WhatsApp, Instagram, Facebook, X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HRK Jewellery" />
    <meta property="og:title" content="HRK Jewellery — Fine Jewellery, Crafted for Everyday Magic" />
    <meta property="og:description" content="Tarnish-free, 18K gold-plated rings, necklaces, earrings, bracelets and anklets. Pay easily by UPI." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ═══════════════════════════════════════════════════════════════
         FAVICON  (all browsers + OS icon surfaces)
         ?v=4 forces a cache refresh — bump this number if you update the logo
    ══════════════════════════════════════════════════════════════════ -->

    <!-- ICO  →  IE, old Edge, Windows taskbar / Start-menu pin (16/32/48 px) -->
    <link rel="icon" type="image/x-icon"  href="/favicon.ico?v=4" />

    <!-- PNG 32×32  →  Chrome, Firefox, modern Edge                          -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />

    <!-- PNG 16×16  →  small tab contexts                                    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />

    <!-- Apple touch icon 180×180  →  iOS Safari "Add to Home Screen"        -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />

    <!-- Android Chrome address-bar / PWA tile colour (matches logo peach)   -->
    <meta name="theme-color" content="#F5A47E" />

    <!-- ═══════════════════════════════════════════════════════════════
         FONTS
    ══════════════════════════════════════════════════════════════════ -->
    <!-- Open connections early to the API and image CDN so data and photos arrive sooner -->
    <link rel="preconnect" href="https://hrk-jewellery.onrender.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
