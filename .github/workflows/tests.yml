name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: API tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Starts a throwaway in-memory MongoDB replica set automatically
      - run: npm test -- --verbose --forceExit
        timeout-minutes: 10

  website:
    name: Website tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
