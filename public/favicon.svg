<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Brand gradient: warm peach → soft pink (matches the logo) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2956B"/>
      <stop offset="100%" stop-color="#EFA0C0"/>
    </linearGradient>
  </defs>

  <!-- Background — rounded square (looks great as a tile on all platforms) -->
  <rect width="100" height="100" rx="14" fill="url(#bg)"/>

  <!-- Gold inner ring for the luxury feel -->
  <rect x="4" y="4" width="92" height="92" rx="11"
        fill="none" stroke="#C9A55A" stroke-width="1.8"/>

  <!--
    HRK monogram
    - Serif font (Georgia fallback) to match the brand
    - Dark brown/near-black text (#2B1308) for strong contrast on light gradient
    - Horizontally centred, vertically centred
    - Letter-spacing tightened so all 3 letters pack tightly at small sizes
  -->
  <text
    x="50" y="65"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="700"
    text-anchor="middle"
    fill="#2B1308"
    letter-spacing="-1"
  >HRK</text>
</svg>
